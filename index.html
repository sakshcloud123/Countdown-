<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey Chinmay!</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  font-family:Georgia,serif;
  background:linear-gradient(145deg,#ffd6e7,#e6d5ff);
  color:#76274f;
}
.card{
  width:100%;
  max-width:390px;
  padding:28px 20px;
  background:#fffafc;
  border-radius:24px;
  text-align:center;
  box-shadow:0 8px 25px #8a467733;
}
.emoji{font-size:42px}
h1{font-size:30px;margin:15px 0}
p{font-size:16px;line-height:1.7}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:25px;
  background:#d63384;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:14px;
}
.note{font-size:12px;color:#9b6b85}
</style>
</head>

<body>
<div class="card">

  <div class="emoji">🎁 🎂 ✨</div>

  <h1>Hey, Chinmay!</h1>

  <p>
    Oiii, birthday boy! 😏<br>
    I have made something for you.
  </p>

  <p>
    But wait... you can't see everything
    on this page! 😂
  </p>

  <p>
    There's a little surprise waiting
    for you on the next page. 💌
  </p>

  <p><b>Ready? Don't be impatient! 👀</b></p>

  <button onclick="location.href='countdown.html'">
    NEXT PAGE ↓ 🎀
  </button>

  <p class="note">Made just for you ✨</p>

</div>
</body>
</html>
