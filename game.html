<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Quiz for Chinmay</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
  background:linear-gradient(145deg,#ffd6e7,#e6d5ff);
  color:#76274f;
}

.card{
  width:100%;
  max-width:390px;
  padding:25px 18px;
  text-align:center;
  background:#fffafc;
  border-radius:24px;
  box-shadow:0 8px 25px #8a467733;
}

h1{font-size:27px}
p{font-size:16px;line-height:1.7}

button{
  display:block;
  width:100%;
  margin:12px 0;
  padding:14px 10px;
  border:0;
  border-radius:22px;
  background:#fce4f0;
  color:#76274f;
  font-size:15px;
  cursor:pointer;
}

button:hover{background:#f5c2dd}

.primary{
  background:#c13578;
  color:white;
}

#result{
  display:none;
  padding:12px;
  margin-top:15px;
  background:#fff0f6;
  border-radius:15px;
}

.small{font-size:12px}
</style>
</head>

<body>
<div class="card">

  <div style="font-size:42px">😏🎀</div>

  <h1>Oiii, Chinmay!</h1>

  <p>
    Before you continue, birthday boy,
    let's see how smart you are! 😂
  </p>

  <p><b>Question 1:</b><br>
  When did we first meet?</p>

  <button onclick="wrong()">A. 12 October 2023 🎂</button>

  <button onclick="correct()">B. 15 May 2023 🫶</button>

  <button onclick="wrong()">C. I forgot already 😭</button>

  <div id="result"></div>

  <div id="next" style="display:none">
    <p>Okayyy, you passed! 😌</p>

    <button class="primary"
      onclick="location.href='surprise.html'">
      NEXT SURPRISE ↓ 🎁
    </button>
  </div>

  <p class="small">No cheating, mister! 😂</p>

</div>

<script>
function correct(){
  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=
    "Yesss! 🥹❤️ 15 May 2023! How could I forget that date?";

  document.getElementById("next").style.display="block";
}

function wrong(){
  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=
    "Oiii! Wrong answer! 😂 Try again, birthday boy!";
}
</script>

</body>
</html>
